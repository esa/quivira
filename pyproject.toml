[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quivira"
version = "0.0.0"
description = "Symbolic and Taylor-based dynamics for pin-jointed lattices"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["quivira*"]